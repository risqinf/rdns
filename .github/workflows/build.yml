name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        # Both production targets: glibc (Rocky decision node) and musl
        # (Alpine exit node). Same static source, CGO_ENABLED=0.
        include:
          - { arch: amd64, musl: false }
          - { arch: amd64, musl: true }
          - { arch: arm64, musl: false }
          - { arch: arm64, musl: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install musl-gcc (for Alpine/musl static builds)
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build all three binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -e
          VER="${{ github.ref_name }}"; [ -z "$VER" ] && VER="dev"
          SUFFIX=""; [ "${{ matrix.musl }}" = "true" ] && SUFFIX="-musl"
          CC="gcc";  [ "${{ matrix.musl }}" = "true" ] && CC="musl-gcc"
          export CC
          mkdir -p dist
          # client + server (cmd/), certs (tools/).
          go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "dist/rdns-client-linux-${{ matrix.arch }}$SUFFIX" ./cmd/rdns-client
          go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "dist/rdns-server-linux-${{ matrix.arch }}$SUFFIX" ./cmd/rdns-server
          go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "dist/rdns-certs-linux-${{ matrix.arch }}$SUFFIX"  ./tools/rdns-certs
          ls -lh dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: rdns-linux-${{ matrix.arch }}${{ matrix.musl && '-musl' || '' }}
          path: |
            dist/rdns-client-*
            dist/rdns-server-*
            dist/rdns-certs-*
            dist/SHA256SUMS
