# rdns-server (exit node) — runs on the country-VPS (Alpine).
# Opens exactly three public ports: udp/53, tcp/443, tcp/80 (PRD §7).
#
# This example is the `my` (Malaysia) exit node.

listen:
  dns:    "0.0.0.0:53"    # udp — public DNS answer service (ACL-gated)
  tunnel: "0.0.0.0:443"   # tcp — mTLS yamux tunnel
  acme:   "0.0.0.0:80"    # tcp — ACME HTTP-01 challenge only

tls:
  # --- Option A: Let's Encrypt (recommended) ---------------------------
  # A real, auto-renewed cert makes tcp/443 look like an ordinary HTTPS
  # server. `domain` is a hostname you own pointing at this VPS. Port 80
  # is used for the HTTP-01 challenge; the cert is cached in
  # /var/lib/rdns/acme so restarts don't re-challenge.
  domain: exit-my.example.com

  # --- Option B: static cert (uncomment instead of `domain`) -----------
  # Mint with: rdns-certs server -ca /etc/rdns/ca.crt -cakey /etc/rdns/ca.key
  #            -name exit-my -dns exit-my.example.com -ip <VPS_IP>
  # cert_file: /etc/rdns/certs/exit-my.crt
  # key_file:  /etc/rdns/certs/exit-my.key

  # CA that signs decision-node (client) certs. Same internal CA the
  # clients trust. Required in both options.
  client_cas: /etc/rdns/ca.crt

  # Optional: PEM of specific client certs to REVOKE (drop by SPKI digest).
  # Revoking a node = append its cert to this file + restart the server.
  revoked_certs: /etc/rdns/certs/revoked.crt   # may be empty/absent

# Who may use this exit node's public udp/53 (PRD §8). List the decision
# nodes' public IPs/CIDRs. Anything else is dropped (and counted).
acl:
  allowed:
    - 203.0.113.10      # SG decision node
    - 198.51.100.20     # ID decision node
  rate_per_sec: 50
  burst: 100

# Where the exit node forwards DNS answers. "system" = the OS resolver
# (systemd-resolved / /etc/resolv.conf), i.e. the local MY resolver — this
# is what makes matched domains resolve to the MY regional view (PRD §5).
dns:
  upstreams:
    - system
  timeout: 3s

logging:
  level: info
  file: /var/log/rdns-server.log
